server {
  listen 8080;
  server_name _;
  resolver ${NGINX_RESOLVER} valid=5s ipv6=off;
  set $simulator_backend ${SIMULATOR_UPSTREAM};
  root /usr/share/nginx/html;
  index index.html;

  location /api/simulator/ {
    rewrite ^/api/simulator/(.*)$ /$1 break;
    proxy_pass $simulator_backend;
    proxy_http_version 1.1;
    proxy_read_timeout 180s;
    proxy_set_header Host $host;
  }
  # The product uses its validated simulator API, not the raw ADK playground.
  location /api/agent/ { return 404; }
  location / {
    add_header Cache-Control "no-store, max-age=0" always;
    try_files $uri $uri/ /index.html;
  }
}

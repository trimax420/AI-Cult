services:
  lgtm:
    image: grafana/otel-lgtm:latest
    container_name: ai-production-lgtm
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - lgtm-data:/data
    environment:
      ENABLE_LOGS_ALL: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  render-simulator:
    build:
      context: ./simulator
    container_name: ai-production-render-simulator
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
      OTEL_SERVICE_NAME: render-farm-simulator
      SIM_TICK_SECONDS: "2"
      PRODUCTION_ID: project-nova
      INCIDENT_DB_PATH: /data/production-director.db
      PRODUCTION_AGENT_URL: http://production-director-agent:8090
    ports:
      - "127.0.0.1:${SIMULATOR_PORT:-8080}:8080"
    volumes:
      - production-director-data:/data
    depends_on:
      lgtm:
        condition: service_healthy

  grafana-provisioner:
    build:
      context: ./grafana
    restart: "no"
    environment:
      GRAFANA_URL: http://lgtm:3000
    depends_on:
      lgtm:
        condition: service_healthy

  operator-dashboard:
    build:
      context: ./operator-dashboard
    container_name: ai-production-operator-dashboard
    ports:
      - "127.0.0.1:4173:80"
    depends_on:
      - render-simulator

  grafana-mcp:
    profiles: ["agent"]
    image: grafana/mcp-grafana:latest
    container_name: ai-production-grafana-mcp
    command:
      - --transport
      - streamable-http
      - --address
      - 0.0.0.0:8000
      - --allowed-hosts
      - grafana-mcp:8000,localhost:8000,127.0.0.1:8000
      - --metrics
    environment:
      GRAFANA_URL: http://lgtm:3000
      GRAFANA_USERNAME: admin
      GRAFANA_PASSWORD: admin
      GRAFANA_ORG_ID: "1"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_SERVICE_NAME: grafana-mcp
      MCP_GRAFANA_SERVER_TOKEN: ${GRAFANA_MCP_AUTH_TOKEN:-local-demo-mcp-token}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      lgtm:
        condition: service_healthy

  production-director-agent:
    profiles: ["agent"]
    build:
      context: .
      dockerfile: production_director_agent/Dockerfile
    container_name: ai-production-director-agent
    environment:
      SIMULATOR_URL: http://render-simulator:8080
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-TRUE}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-project-f5be723f-d87a-4652-b84}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-asia-south1}
      GOOGLE_APPLICATION_CREDENTIALS: /var/secrets/google/application_default_credentials.json
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GRAFANA_MCP_URL: ${GRAFANA_MCP_URL:-http://grafana-mcp:8000/mcp}
      GRAFANA_MCP_AUTH_TOKEN: ${GRAFANA_MCP_AUTH_TOKEN:-local-demo-mcp-token}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_SERVICE_NAME: production-director-agent
    ports:
      - "127.0.0.1:8090:8090"
    # Google Cloud CLI stores Application Default Credentials under %APPDATA%
    # on Windows. Long-form syntax avoids interpreting the drive-letter colon as
    # a volume separator, and does not depend on a specific Windows user name.
    volumes:
      - type: bind
        source: ${APPDATA}/gcloud/application_default_credentials.json
        target: /var/secrets/google/application_default_credentials.json
        read_only: true
    depends_on:
      - render-simulator
      - grafana-mcp

volumes:
  lgtm-data:
  production-director-data:

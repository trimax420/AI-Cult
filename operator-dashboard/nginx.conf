server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/simulator/ {
    # Docker can assign a new container IP when optional profiles are started.
    # Resolve this service name at request time so a running dashboard does not
    # keep proxying to a simulator instance that has just been recreated.
    resolver 127.0.0.11 valid=10s;
    set $simulator_upstream http://render-simulator:8080;
    rewrite ^/api/simulator/(.*)$ /$1 break;
    proxy_pass $simulator_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /api/agent/ {
    # The ADK service is optional. Docker's resolver is used at request time so
    # the dashboard can still start in the fully local mock-agent mode.
    resolver 127.0.0.11 valid=10s;
    set $agent_upstream http://production-director-agent:8090;
    rewrite ^/api/agent/(.*)$ /$1 break;
    proxy_pass $agent_upstream;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 180s;
    proxy_intercept_errors on;
    error_page 502 = @mock_agent;
    proxy_set_header Host production-director-agent:8090;
    proxy_set_header Origin http://production-director-agent:8090;
    proxy_set_header Referer "";
  }

  location @mock_agent {
    # The agent location has already stripped /api/agent/ before this fallback.
    resolver 127.0.0.11 valid=10s;
    set $fallback_upstream http://render-simulator:8080;
    rewrite ^/(.*)$ /agent-fallback/$1 break;
    proxy_pass $fallback_upstream;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host render-simulator:8080;
  }

  location / {
    # The dashboard is often left open while its local Docker image is rebuilt.
    # Avoid retaining an obsolete action-flow bundle in an existing browser tab.
    add_header Cache-Control "no-store, max-age=0" always;
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/simulator/ {
    proxy_pass http://render-simulator:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /api/agent/ {
    proxy_pass http://production-director-agent:8090/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 180s;
    proxy_set_header Host production-director-agent:8090;
    proxy_set_header Origin http://production-director-agent:8090;
    proxy_set_header Referer "";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

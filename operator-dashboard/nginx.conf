server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/simulator/ {
    proxy_pass http://render-simulator:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /api/agent/ {
    # The ADK service is optional. Docker's resolver is used at request time so
    # the dashboard can still start in the fully local mock-agent mode.
    resolver 127.0.0.11 valid=10s;
    set $agent_upstream production-director-agent:8090;
    proxy_pass http://$agent_upstream/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 180s;
    proxy_set_header Host production-director-agent:8090;
    proxy_set_header Origin http://production-director-agent:8090;
    proxy_set_header Referer "";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 8080;
  server_name _;
  resolver ${NGINX_RESOLVER} valid=5s ipv6=off;
  set $simulator_backend ${SIMULATOR_UPSTREAM};
  set $agent_backend ${AGENT_UPSTREAM};

  root /usr/share/nginx/html;
  index index.html;

  location /api/simulator/ {
    # Docker can assign a new container IP when optional profiles are started.
    # Resolve this service name at request time so a running dashboard does not
    # keep proxying to a simulator instance that has just been recreated.
    rewrite ^/api/simulator/(.*)$ /$1 break;
    proxy_pass $simulator_backend;
    proxy_http_version 1.1;
    proxy_read_timeout 180s;
    proxy_set_header Host $host;
  }

  location /api/agent/ {
    # The ADK service is optional. Docker's resolver is used at request time so
    # the dashboard can still start in the local calculator mode.
    rewrite ^/api/agent/(.*)$ /$1 break;
    proxy_pass $agent_backend;
    proxy_http_version 1.1;
    proxy_read_timeout 180s;
    proxy_buffering off;
    proxy_intercept_errors on;
    error_page 502 504 = @agent_unavailable;
    proxy_set_header Host production-director-agent:8090;
    proxy_set_header Origin http://production-director-agent:8090;
    proxy_set_header Referer "";
  }

  location @agent_unavailable {
    default_type application/json;
    return 503 '{"detail":"The live agent is unavailable. Retry the connection."}';
  }

  location / {
    # The dashboard is often left open while its local Docker image is rebuilt.
    # Avoid retaining an obsolete action-flow bundle in an existing browser tab.
    add_header Cache-Control "no-store, max-age=0" always;
    try_files $uri $uri/ /index.html;
  }
}
